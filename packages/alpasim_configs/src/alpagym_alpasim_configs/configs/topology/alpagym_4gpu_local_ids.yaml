# @package _global_
# Same split as alpagym_4gpu, for clusters where Slurm renumbers the GPUs it
# binds to a step. There `--gpu-bind=mask_gpu:0xf0` exposes the node's GPUs 4-7
# as 0-3 inside the Wizard step, so the services address them by those ids.

defines:
  nre_cache_size: 16
  physics_cache_size: 16

services:
  renderer:
    environments:
      - OMP_NUM_THREADS=1
      - HOME=/tmp
    replicas_per_container: 1
    gpus: [0, 1, 2, 3]

  driver: null

  physics:
    replicas_per_container: 1
    gpus: [0, 1, 2, 3]

  controller:
    replicas_per_container: 6
    gpus: null

  trafficsim:
    replicas_per_container: 1
    gpus: null

runtime:
  nr_workers: 1
  endpoints:
    # Total capacity per service = nr_gpus x replicas_per_container x n_concurrent_rollouts.
    # REND: 4 x 1 x 3 = 12
    # PHYS: 4 x 1 x 3 = 12
    # CONT: 1 CPU service x 6 x 2 = 12
    renderer:
      n_concurrent_rollouts: 3
    physics:
      n_concurrent_rollouts: 3
      skip: false
    controller:
      n_concurrent_rollouts: 2
      skip: false
    trafficsim:
      skip: true
