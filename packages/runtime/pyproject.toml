[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpagym-runtime"
version = "0.1.0"
dependencies = [
  "alpagym-host",
  "alpagym-plugins",
  "alpamayo-recipes",
  "cosmos-rl[rl,wfm]",
  "einops",
  "flash-attn==2.8.3",
  "grpcio",
  "grouped-gemm @ git+https://github.com/fanshiqing/grouped_gemm@v1.1.4",
  # `alpagym_runtime.posttrain` runs inside posttrain, which reaches i4 modules that these four
  # satisfy: loguru (imaginaire.utils.log -- missing it also breaks lazy_config,
  # cosmos3.utils.parallelism and posttrain.model.parallel_dims), iopath
  # (imaginaire.lazy_config), imageio (imaginaire.utils.easy_io video handler), termcolor
  # (cosmos-rl's WFM module discovery). `multi-storage-client` is deliberately absent -- it would unlock i4's config
  # root but moves protobuf 4.25.9 -> 7.35.1, and AlpaGym exchanges protobuf messages with the
  # simulator on every one of an episode's 22 ticks.
  # cosmos-rl[rl] brings `ray` transitively, but posttrain's NIXL weight plane needs a floor
  # it does not set: `deregister_nixl_memory` (and the register/target/wait RDT surface around
  # it) lands in 2.56.1, and `workers/nixl.py::MIN_RAY` refuses the transport below that. Held
  # at that line rather than tracking latest: posttrain's own preflight pins 2.56.1, so a
  # newer Ray would be a version this weight plane has not been exercised on.
  "ray>=2.56.1,<2.57",
  "imageio",
  "iopath",
  "loguru",
  "nvidia-ml-py",
  "psutil",
  "termcolor",
  "torch==2.8.0",
  "torchao>=0.10.0,<0.16.0",
  "torchaudio>=2.7.1",
  "torchvision>=0.22.1",
  "wandb>0.13.1",
  "alpasim-grpc",
]

[project.scripts]
check-policy-bundles = "alpagym_runtime.policies.check_policy_bundles:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
